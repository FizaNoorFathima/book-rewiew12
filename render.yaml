services:
  - type: web
    name: bookmarked-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      - key: DATABASE_URL
        fromDatabase:
          name: bookmarked-db
          property: connectionString
      - key: FRONTEND_HOST
        fromService:
          type: web
          name: bookmarked-frontend
          property: host

  - type: web
    name: bookmarked-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: bookmarked-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: bookmarked-db
    databaseName: bookmarked_library
    user: bookmarked_user
    plan: free
